name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r backend/requirements-dev.txt
      - name: Ruff
        run: cd backend && ruff check app tests
      - name: Bandit (SAST)
        run: cd backend && bandit -q -r app -c pyproject.toml
      - name: pip-audit (dependency CVEs)
        run: cd backend && pip-audit -r requirements.txt
      - name: Gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}

  test:
    needs: lint-and-security
    runs-on: ubuntu-latest
    strategy:
      matrix: {database: [sqlite, postgres]}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_DB: sentinel_test, POSTGRES_USER: sentinel, POSTGRES_PASSWORD: sentinel}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r backend/requirements-dev.txt
      - name: Cache embeddings
        uses: actions/cache@v4
        with: {path: models/embeddings, key: glove300-100k-v1}
      - run: python scripts/download_embeddings.py
        if: hashFiles('models/embeddings/glove300_100k.npy') == ''
      - name: Tests (${{ matrix.database }})
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg2://sentinel:sentinel@localhost:5432/sentinel_test' || '' }}
        run: cd backend && python -m pytest --cov=app --cov-report=term-missing:skip-covered

  build-images:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t sentinel-aml-api:${{ github.sha }} .
      - run: docker build -f frontend/Dockerfile -t sentinel-aml-dashboard:${{ github.sha }} .
      - name: Trivy image scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: "sentinel-aml-api:${{ github.sha }}", severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true}
