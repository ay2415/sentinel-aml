[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101", "B008", "E501", "UP007", "S311", "B904", "UP042", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E402", "F841"]
# evaluation scripts import `common` first because it puts backend/ on sys.path
"../evaluation/**" = ["I001", "E402", "S"]

[tool.bandit]
exclude_dirs = ["tests"]
